services:
  - type: web
    name: acolyte-backend
    env: node
    rootDir: ./backend
    plan: free
    buildCommand: cd ./backend && npm ci
    startCommand: cd ./backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
